<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IsItMe verdict</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: light-dark(#ffffff, #1b1b1d);
    --panel: light-dark(#f6f7f9, #242428);
    --text: light-dark(#17181a, #f2f2f3);
    --muted: light-dark(#5b606a, #a4a8b1);
    --line: light-dark(#e3e5e9, #34353a);
    --ok: light-dark(#0f7a3d, #4ad18a);
    --ok-bg: light-dark(#e7f6ed, #173326);
    --warn: light-dark(#8a5a00, #f2c14e);
    --warn-bg: light-dark(#fff5dc, #3a2f12);
    --down: light-dark(#b42318, #ff7b6e);
    --down-bg: light-dark(#fdecea, #3d1d1a);
    --accent: light-dark(#1d4ed8, #8ab4ff);
    --font: var(--font-sans, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif);
  }
  [data-theme="light"] { color-scheme: light; }
  [data-theme="dark"] { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; color: var(--text); font: 14px/1.45 var(--font); }
  .card { background: var(--bg); border-radius: 14px; overflow: hidden; }
  .hero { padding: 16px 18px 14px; display: flex; gap: 12px; align-items: flex-start; }
  .hero.ok { background: var(--ok-bg); } .hero.degraded { background: var(--warn-bg); } .hero.down { background: var(--down-bg); }
  .dot { flex: none; width: 12px; height: 12px; border-radius: 50%; margin-top: 5px; }
  .ok .dot { background: var(--ok); } .degraded .dot { background: var(--warn); } .down .dot { background: var(--down); }
  .label { font-size: 12px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }
  .ok .label { color: var(--ok); } .degraded .label { color: var(--warn); } .down .label { color: var(--down); }
  .headline { font-size: 16px; font-weight: 600; margin: 2px 0 4px; }
  .meta { color: var(--muted); font-size: 12px; word-break: break-all; }
  section { padding: 12px 18px; border-top: 1px solid var(--line); }
  h3 { margin: 0 0 8px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
  ul { list-style: none; margin: 0; padding: 0; }
  li.f { display: grid; grid-template-columns: 18px 1fr; gap: 8px; padding: 5px 0; }
  .ic { font-size: 13px; line-height: 20px; text-align: center; }
  .ic.pass { color: var(--ok); } .ic.warn { color: var(--warn); } .ic.fail { color: var(--down); } .ic.info { color: var(--muted); }
  .tag { display: inline-block; font-size: 10px; font-weight: 600; padding: 1px 6px; border-radius: 6px;
         background: var(--panel); color: var(--muted); margin-right: 6px; vertical-align: 1px; }
  .detail { color: var(--muted); font-size: 12.5px; word-break: break-word; }
  ol.fixes { margin: 0; padding-left: 18px; } ol.fixes li { padding: 3px 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 12px; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 13px; padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line);
           background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); border-color: var(--accent); color: light-dark(#fff, #0b1530); }
  textarea { width: 100%; min-height: 120px; margin-top: 8px; font: 12px ui-monospace, Menlo, monospace;
             background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 8px; }
  .empty { padding: 22px 18px; color: var(--muted); }
  .hidden { display: none; }
</style>
</head>
<body>
<div class="card" id="root"><div class="empty" id="loading">Running checks…</div></div>
<script>
(() => {
  "use strict";
  const root = document.getElementById("root");
  let nextId = 1;
  const pending = new Map();
  let lastData = null;

  // ── MCP Apps bridge (postMessage JSON-RPC) ──────────────────────────
  const post = (msg) => { try { window.parent.postMessage(msg, "*"); } catch (_) {} };
  const request = (method, params) => new Promise((resolve, reject) => {
    const id = nextId++;
    pending.set(id, { resolve, reject });
    post({ jsonrpc: "2.0", id, method, params });
    setTimeout(() => { if (pending.has(id)) { pending.delete(id); reject(new Error("timeout")); } }, 10000);
  });
  const notify = (method, params) => post({ jsonrpc: "2.0", method, params });

  function applyContext(ctx) {
    if (!ctx) return;
    if (ctx.theme) document.documentElement.dataset.theme = ctx.theme;
    const vars = ctx.styles && ctx.styles.variables;
    if (vars) for (const [k, v] of Object.entries(vars)) {
      if (typeof k === "string" && k.startsWith("--") && typeof v === "string") document.documentElement.style.setProperty(k, v);
    }
  }

  window.addEventListener("message", (event) => {
    if (event.source !== window.parent) return;
    const msg = event.data;
    if (!msg || msg.jsonrpc !== "2.0") return;
    if (msg.id !== undefined && pending.has(msg.id) && (msg.result !== undefined || msg.error !== undefined)) {
      const p = pending.get(msg.id); pending.delete(msg.id);
      msg.error ? p.reject(msg.error) : p.resolve(msg.result);
      return;
    }
    if (msg.method === "ui/notifications/tool-result") render(msg.params && msg.params.structuredContent, msg.params);
    else if (msg.method === "ui/notifications/host-context-changed") applyContext(msg.params);
    else if (msg.method === "ui/resource-teardown" && msg.id !== undefined) post({ jsonrpc: "2.0", id: msg.id, result: {} });
    else if (msg.method === "ping" && msg.id !== undefined) post({ jsonrpc: "2.0", id: msg.id, result: {} });
  });

  request("ui/initialize", {
    protocolVersion: "2026-01-26",
    appInfo: { name: "IsItMe verdict", version: "2.0.0" },
    appCapabilities: { availableDisplayModes: ["inline"] },
  }).then((res) => { applyContext(res && res.hostContext); notify("ui/notifications/initialized", {}); })
    .catch(() => {});

  // ── ChatGPT compatibility (window.openai) ───────────────────────────
  function fromOpenAI() {
    const oa = window.openai;
    if (oa && oa.toolOutput && !lastData) render(oa.toolOutput);
    if (oa && oa.theme) document.documentElement.dataset.theme = oa.theme;
  }
  window.addEventListener("openai:set_globals", fromOpenAI);
  fromOpenAI();

  // ── Size reporting ──────────────────────────────────────────────────
  let lastH = 0;
  new ResizeObserver(() => {
    const h = Math.ceil(document.documentElement.getBoundingClientRect().height);
    if (h !== lastH) { lastH = h; notify("ui/notifications/size-changed", { width: document.documentElement.clientWidth, height: h }); }
  }).observe(document.body);

  // ── Rendering (all text is inserted with textContent: tool output is untrusted) ──
  const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = String(text); return e; };
  const ICON = { pass: "✓", warn: "!", fail: "✕", info: "i" };
  const LABEL = { ok: "Up", degraded: "Degraded", down: "Down" };

  function openLink(url) {
    if (!/^https:\/\//i.test(url)) return;
    request("ui/open-link", { url }).catch(() => {
      if (window.openai && window.openai.openExternal) window.openai.openExternal({ href: url });
      else window.open(url, "_blank", "noopener");
    });
  }

  function askFollowUp(text) {
    request("ui/message", { role: "user", content: { type: "text", text } }).catch(() => {
      if (window.openai && window.openai.sendFollowUpMessage) window.openai.sendFollowUpMessage({ prompt: text });
    });
  }

  function render(data, rawResult) {
    if (!data || typeof data !== "object" || !data.status) {
      if (rawResult && rawResult.isError) {
        root.replaceChildren(el("div", "empty", (rawResult.content && rawResult.content[0] && rawResult.content[0].text) || "The check failed."));
      }
      return;
    }
    lastData = data;
    const status = ["ok", "degraded", "down"].includes(data.status) ? data.status : "degraded";
    const frag = document.createDocumentFragment();

    const hero = el("div", "hero " + status);
    hero.append(el("div", "dot"));
    const hb = el("div");
    hb.append(el("div", "label", (LABEL[status] || status) + " · " + (data.cause_label || "")));
    hb.append(el("div", "headline", data.headline || ""));
    hb.append(el("div", "meta", (data.target || "") + " · checked from " + (data.vantage || "?") +
      (data.elapsed_ms ? " in " + data.elapsed_ms + " ms" : "")));
    hero.append(hb);
    frag.append(hero);

    const findings = Array.isArray(data.findings) ? data.findings : [];
    if (findings.length) {
      const s = el("section"); s.append(el("h3", null, "Checks"));
      const ul = el("ul");
      for (const f of findings) {
        const st = ICON[f.status] ? f.status : "info";
        const li = el("li", "f");
        li.append(el("span", "ic " + st, ICON[st]));
        const body = el("div");
        body.append(el("span", "tag", (f.check || "").toUpperCase()));
        body.append(document.createTextNode(f.title || ""));
        if (f.detail) body.append(el("div", "detail", f.detail));
        li.append(body); ul.append(li);
      }
      s.append(ul); frag.append(s);
    }

    const fixes = Array.isArray(data.fixes) ? data.fixes : [];
    if (fixes.length) {
      const s = el("section"); s.append(el("h3", null, "Suggested next steps"));
      const ol = el("ol", "fixes");
      for (const x of fixes) ol.append(el("li", null, x));
      s.append(ol); frag.append(s);
    }

    const providers = Array.isArray(data.providers) ? data.providers : [];
    const vendorRows = (data.details && Array.isArray(data.details.vendor_status)) ? data.details.vendor_status : [];
    if (providers.length) {
      const s = el("section"); s.append(el("h3", null, "Detected providers"));
      const chips = el("div", "chips");
      for (const p of providers) {
        const row = vendorRows.find((v) => v.vendor === p.vendor);
        const c = el("button", "chip", (row ? row.name : p.vendor) + (row ? " · " + row.status : ""));
        c.title = (p.evidence || []).join("; ");
        if (row && row.page) c.addEventListener("click", () => openLink(row.page));
        chips.append(c);
      }
      s.append(chips); frag.append(s);
    }

    const act = el("section"); const bar = el("div", "actions");
    const ta = el("textarea", "hidden"); ta.readOnly = true; ta.value = data.ticket_summary || "";
    const copy = el("button", "primary", "Copy ticket summary");
    copy.addEventListener("click", async () => {
      ta.classList.remove("hidden");
      try { await navigator.clipboard.writeText(ta.value); copy.textContent = "Copied ✓"; }
      catch (_) { ta.focus(); ta.select(); copy.textContent = "Select & copy below"; }
    });
    bar.append(copy);
    if (status !== "ok") {
      const fix = el("button", null, "Walk me through the fix");
      fix.addEventListener("click", () => askFollowUp("Walk me step by step through fixing this " + (data.cause_label || "issue").toLowerCase() + " on " + (data.host || data.target) + "."));
      bar.append(fix);
    }
    act.append(bar, ta); frag.append(act);

    root.replaceChildren(frag);
  }
})();
</script>
</body>
</html>
