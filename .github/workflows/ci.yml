name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Validate ChatGPT plugin package (placeholders allowed in CI)
        run: python chatgpt-plugin/build.py --mcp-url https://ci.example.com/mcp --demo-url https://ci.example.com/demo --out /tmp/plugin
