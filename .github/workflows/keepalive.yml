name: Keep hosted server awake

# Render's free plan sleeps after 15 minutes without traffic, and a cold start
# (~50 s) makes ChatGPT tool calls time out. Ping the health check regularly.
# Note: GitHub pauses scheduled workflows after 60 days without repository activity.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping /healthz
        run: curl -fsS --retry 3 --retry-delay 20 --max-time 90 https://isitme-mcp.onrender.com/healthz
